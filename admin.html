<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<title>Beheer — De Coachtrain</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body { font-family: Arial, sans-serif; max-width: 860px; margin: 40px auto; padding: 0 20px; color: #111; background: #f5f5f5; }

  /* Login */
  #login { max-width: 360px; margin: 80px auto; background: #fff; border-radius: 10px; padding: 32px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
  #login h1 { font-size: 20px; margin: 0 0 20px; }
  #login input { width: 100%; padding: 10px 12px; font-size: 14px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 10px; }
  #login button { width: 100%; padding: 10px; font-size: 14px; font-weight: 700; background: #111; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
  #login button:hover { background: #333; }
  #login-fout { color: #b91c1c; font-size: 13px; margin-top: 8px; display: none; }

  /* Dashboard */
  #dash { display: none; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .meta-lijn { font-size: 13px; color: #888; margin-bottom: 28px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: #888; border-bottom: 1px solid #ddd; padding-bottom: 6px; margin: 28px 0 12px; }
  button.uitloggen { float: right; font-size: 12px; padding: 5px 12px; background: none; border: 1px solid #ccc; border-radius: 5px; cursor: pointer; color: #666; }
  button.uitloggen:hover { border-color: #888; color: #111; }

  /* Teams */
  .team-blok { background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 12px; overflow: hidden; }
  .team-header { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; cursor: pointer; }
  .team-naam { font-weight: 700; font-size: 15px; }
  .team-count { font-size: 12px; color: #888; }
  .team-header-rechts { display: flex; align-items: center; gap: 10px; }
  .team-body { border-top: 1px solid #f0f0f0; padding: 0 16px 12px; display: none; }
  .team-blok.open .team-body { display: block; }
  .team-blok.open .chevron { transform: rotate(180deg); }
  .chevron { font-size: 11px; color: #aaa; transition: transform .15s; }
  .leden-tabel { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  .leden-tabel th { text-align: left; font-size: 11px; text-transform: uppercase; color: #aaa; padding: 4px 0; border-bottom: 1px solid #eee; }
  .leden-tabel td { padding: 6px 0; border-bottom: 1px solid #f5f5f5; vertical-align: middle; }
  .leden-tabel tr:last-child td { border-bottom: none; }

  /* Knoppen */
  .btn { display: inline-block; font-size: 12px; font-weight: 600; padding: 5px 12px; border-radius: 5px; text-decoration: none; cursor: pointer; border: none; }
  .btn-primary { background: #111; color: #fff; }
  .btn-primary:hover { background: #333; }
  .btn-ghost { background: #f3f4f6; color: #374151; }
  .btn-ghost:hover { background: #e5e7eb; }
  .btn-team { background: #eff6ff; color: #1d4ed8; font-size: 12px; }
  .btn-team:hover { background: #dbeafe; }
  .team-footer { padding-top: 8px; }

  /* Teamstatus */
  .badge-status { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 10px; }
  .badge-status.klaar  { background: #d1fae5; color: #065f46; }
  .badge-status.bijna  { background: #fef3c7; color: #92400e; }
  .badge-status.weinig { background: #fee2e2; color: #991b1b; }
  .team-stats { font-size: 11px; color: #aaa; margin: 6px 0 4px; }
  .team-footer-warn { font-size: 11px; color: #92400e; margin-top: 5px; }

  /* Ververs-knop */
  .btn-ververs { float: right; font-size: 12px; padding: 5px 12px; background: none;
    border: 1px solid #ccc; border-radius: 5px; cursor: pointer; color: #666; margin-left: 6px; }
  .btn-ververs:hover { border-color: #888; color: #111; }

  /* Geen team */
  .ind-rij { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
  .ind-rij:last-child { border-bottom: none; }
  .ind-naam { font-weight: 600; }
  .ind-sub { font-size: 11px; color: #888; }
  .ind-rechts { display: flex; gap: 8px; align-items: center; }

  /* Laad/leeg states */
  #laden { color: #888; font-size: 14px; padding: 24px 0; }
  .leeg { color: #aaa; font-size: 13px; font-style: italic; }

  /* Extra knoppen */
  .btn-danger { background: #fee2e2; color: #b91c1c; }
  .btn-danger:hover { background: #fecaca; }
  .btn-restore { background: #d1fae5; color: #065f46; }
  .btn-restore:hover { background: #a7f3d0; }

  /* Filter balk */
  .filter-balk { display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
    padding: 10px 14px; background: #fff; border-radius: 8px; border: 1px solid #e5e7eb; margin-bottom: 20px; }
  #search { flex: 1; min-width: 180px; padding: 7px 10px; font-size: 13px;
    border: 1px solid #ddd; border-radius: 5px; }
  #search:focus { outline: none; border-color: #6366f1; }
  .filter-toggle { font-size: 13px; color: #555; display: flex; align-items: center; gap: 5px;
    cursor: pointer; white-space: nowrap; user-select: none; }

  /* Test badge + dim */
  .badge-test { display: inline-block; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px; background: #fef3c7; color: #92400e; margin-left: 4px; }
  .lid-test td { opacity: .5; }
  .ind-rij.is-test { opacity: .5; }
  .btn-mark-test   { background: #fef3c7; color: #92400e; }
  .btn-mark-test:hover   { background: #fde68a; }
  .btn-unmark-test { background: #f3f4f6; color: #374151; }
  .btn-unmark-test:hover { background: #e5e7eb; }

  /* Uitgesloten badge + rij-dimming */
  .badge-uitgesloten { display: inline-block; font-size: 10px; font-weight: 700;
    padding: 1px 6px; border-radius: 10px; background: #f1f5f9; color: #64748b; margin-left: 4px; }
  .lid-uitgesloten td { opacity: .4; }
  .btn-include { background: #d1fae5; color: #065f46; }
  .btn-include:hover { background: #a7f3d0; }
  .btn-exclude { background: #f1f5f9; color: #475569; }
  .btn-exclude:hover { background: #e2e8f0; }

  /* Verwijderde inzendingen sectie */
  #del-toggle { cursor: pointer; user-select: none; }
  #del-toggle:hover { color: #555; }
  #del-lijst .ind-rij { opacity: .7; }

  /* Modal */
  #modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
    z-index: 1000; align-items: center; justify-content: center; }
  #modal-overlay.actief { display: flex; }
  #modal-box { background: #fff; border-radius: 10px; padding: 28px; width: 100%; max-width: 420px; margin: 0 20px; }
  #modal-box h3 { margin: 0 0 18px; font-size: 16px; }
  .modal-label { display: block; font-size: 12px; color: #666; margin-bottom: 2px; margin-top: 10px; }
  .modal-label:first-of-type { margin-top: 0; }
  .modal-input { display: block; width: 100%; padding: 8px 10px; font-size: 13px;
    border: 1px solid #ddd; border-radius: 5px; }
  .modal-input:focus { outline: none; border-color: #6366f1; box-shadow: 0 0 0 2px #eef2ff; }
  #modal-fout { color: #b91c1c; font-size: 12px; margin-top: 8px; display: none; }
  .modal-acties { display: flex; gap: 8px; margin-top: 20px; }
</style>
</head>
<body>

<!-- Login -->
<div id="login">
  <h1>Beheer</h1>
  <input id="token-input" type="password" placeholder="Admin token" autocomplete="current-password">
  <button onclick="login()">Inloggen</button>
  <p id="login-fout"></p>
</div>

<!-- Modal: inzending bewerken -->
<div id="modal-overlay">
  <div id="modal-box">
    <h3>Inzending bewerken</h3>
    <input type="hidden" id="modal-id">
    <label class="modal-label">Naam</label>
    <input id="modal-naam"  type="text"  class="modal-input">
    <label class="modal-label">E-mail</label>
    <input id="modal-email" type="email" class="modal-input">
    <label class="modal-label">Team (leeg = geen team)</label>
    <input id="modal-team"  type="text"  class="modal-input" placeholder="">
    <label class="modal-label">Rol (optioneel)</label>
    <input id="modal-rol"   type="text"  class="modal-input" placeholder="">
    <label class="filter-toggle" style="margin-top:12px">
      <input type="checkbox" id="modal-istest"> Markeer als testinzending
    </label>
    <p id="modal-fout"></p>
    <div class="modal-acties">
      <button onclick="slaOp()" class="btn btn-primary" style="flex:1">Opslaan</button>
      <button onclick="sluitModal()" class="btn btn-ghost">Annuleren</button>
    </div>
  </div>
</div>

<!-- Dashboard -->
<div id="dash">
  <button class="uitloggen" onclick="uitloggen()">Uitloggen</button>
  <button class="btn-ververs" onclick="laadData()">Ververs</button>
  <h1>Dashboard</h1>
  <div class="meta-lijn" id="dash-meta"></div>
  <div class="filter-balk">
    <input id="search" type="search" placeholder="Zoek op naam, e-mail of team…" oninput="renderFiltered()">
    <label class="filter-toggle"><input type="checkbox" id="toggle-test" onchange="renderFiltered()"> Toon testinzendingen</label>
    <label class="filter-toggle"><input type="checkbox" id="toggle-del"  onchange="renderFiltered()"> Toon verwijderde</label>
  </div>
  <div id="laden">Laden…</div>
  <div id="teams-sectie" style="display:none">
    <h2>Teams</h2>
    <div id="teams-lijst"></div>
    <h2>Individueel (geen team)</h2>
    <div id="ind-lijst"></div>
    <h2 id="del-toggle" onclick="toggleDel()">Verwijderde inzendingen <span id="del-count"></span> <span id="del-chevron">▶</span></h2>
    <div id="del-lijst" style="display:none"></div>
  </div>
</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let TOKEN   = sessionStorage.getItem('adminToken') || '';
let allSubs = [];  // volledige dataset; filtering in renderFiltered()

function fmt(d) {
  return new Date(d).toLocaleDateString('nl-NL', { day:'numeric', month:'short', year:'numeric' });
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ──────────────────────────────────────────────────────────────────────
if (TOKEN) { toonDash(); laadData(); } else { toonLogin(); }

// ── Login / Uitloggen ─────────────────────────────────────────────────────────
document.getElementById('token-input').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

async function login() {
  const token = document.getElementById('token-input').value.trim();
  const fout  = document.getElementById('login-fout');
  fout.style.display = 'none';
  if (!token) { fout.textContent = 'Voer een token in.'; fout.style.display = 'block'; return; }
  const r = await fetch('/api/admin/submissions', { headers: { 'X-Admin-Token': token } });
  if (r.status === 403) { fout.textContent = 'Ongeldig token.'; fout.style.display = 'block'; return; }
  if (!r.ok)            { fout.textContent = 'Serverfout.';     fout.style.display = 'block'; return; }
  TOKEN = token;
  sessionStorage.setItem('adminToken', TOKEN);
  toonDash();
  verwerkData(await r.json());
}

function uitloggen() {
  TOKEN=''; allSubs=[]; sessionStorage.removeItem('adminToken');
  document.getElementById('token-input').value='';
  document.getElementById('login-fout').style.display='none';
  toonLogin();
}
function toonLogin() { document.getElementById('login').style.display='block'; document.getElementById('dash').style.display='none'; }
function toonDash()  { document.getElementById('login').style.display='none';  document.getElementById('dash').style.display='block'; }

// ── Data ophalen ──────────────────────────────────────────────────────────────
async function laadData() {
  document.getElementById('laden').textContent = 'Laden…';
  document.getElementById('teams-sectie').style.display = 'none';
  try {
    const r = await fetch('/api/admin/submissions', { headers: { 'X-Admin-Token': TOKEN } });
    if (r.status === 403) { uitloggen(); return; }
    verwerkData(await r.json());
  } catch (e) { document.getElementById('laden').textContent = 'Verbindingsfout.'; }
}

// ── Verwerken + filteren ──────────────────────────────────────────────────────
function verwerkData(data) {
  allSubs = data.submissions || [];
  renderFiltered();
}

function renderFiltered() {
  const query    = (document.getElementById('search').value || '').trim().toLowerCase();
  const showTest = document.getElementById('toggle-test').checked;
  const showDel  = document.getElementById('toggle-del').checked;

  let subs = allSubs;
  if (!showDel)  subs = subs.filter(s => !s.deleted_at);
  if (!showTest) subs = subs.filter(s => !s.is_test);
  if (query)     subs = subs.filter(s =>
    (s.naam      ||'').toLowerCase().includes(query) ||
    (s.email     ||'').toLowerCase().includes(query) ||
    (s.team_code ||'').toLowerCase().includes(query)
  );
  if (showDel) {
    document.getElementById('del-lijst').style.display = 'block';
    document.getElementById('del-chevron').textContent = '▼';
  }
  renderData(subs);
}

// ── Render ────────────────────────────────────────────────────────────────────
function renderData(subs) {
  const actief  = subs.filter(s => !s.deleted_at);
  const deleted = subs.filter(s =>  s.deleted_at);

  document.getElementById('laden').style.display = 'none';
  document.getElementById('teams-sectie').style.display = 'block';

  const totActief    = allSubs.filter(s => !s.deleted_at && !s.is_test).length;
  const totTest      = allSubs.filter(s => !s.deleted_at &&  s.is_test).length;
  const totDel       = allSubs.filter(s =>  s.deleted_at).length;
  const totUitgesl   = allSubs.filter(s => !s.deleted_at && s.excluded_from_team).length;

  // Bereken rapportklare teams uit volledige (ongefilterde) dataset
  const _teamTelling = {};
  for (const s of allSubs) {
    if (s.deleted_at || !(s.team_code||'').trim()) continue;
    const k = s.team_code.trim().toLowerCase();
    if (!_teamTelling[k]) _teamTelling[k] = 0;
    if (!s.is_test && !s.excluded_from_team) _teamTelling[k]++;
  }
  const totRapportKlaar = Object.values(_teamTelling).filter(n => n >= 3).length;

  document.getElementById('dash-meta').textContent =
    `${totActief} actief · ${totTest} test · ${totUitgesl} uitgesloten · ${totDel} verwijderd`
    + ` · ${totRapportKlaar} team${totRapportKlaar===1?'':'s'} rapportklaar`
    + ` · bijgewerkt ${new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})}`;
  document.getElementById('del-count').textContent = deleted.length ? `(${deleted.length})` : '';

  // Groepeer actieve inzendingen
  const teams={}, ind=[];
  for (const s of actief) {
    const code=(s.team_code||'').trim();
    if (!code) { ind.push(s); continue; }
    const key=code.toLowerCase();
    if (!teams[key]) teams[key]={label:code,leden:[]};
    teams[key].leden.push(s);
  }

  // Actieknoppen — is_test + excluded_from_team meegeven aan modal
  function acties(s) {
    const d=JSON.stringify({id:s.id,naam:s.naam,email:s.email,team:s.team_code||'',rol:s.rol||'',is_test:!!s.is_test,excluded_from_team:!!s.excluded_from_team}).replace(/'/g,"\\'");
    const uitslBtn = s.excluded_from_team
      ? `<button onclick="toggleUitsluiting('${s.id}')" class="btn btn-include">Meenemen</button>`
      : `<button onclick="toggleUitsluiting('${s.id}')" class="btn btn-exclude">Uitsluiten</button>`;
    const testBtn = s.is_test
      ? `<button onclick="toggleTest('${s.id}')" class="btn btn-unmark-test">Maak echt</button>`
      : `<button onclick="toggleTest('${s.id}')" class="btn btn-mark-test">Markeer test</button>`;
    return `<a href="/?rapport=${s.id}" target="_blank" class="btn btn-ghost">Rapport</a>
            <button onclick='openModal(${d})' class="btn btn-ghost">Bewerk</button>
            ${uitslBtn}
            ${testBtn}
            <button onclick="verwijder('${s.id}','${esc(s.naam)}')" class="btn btn-danger">Verwijder</button>`;
  }
  function testBadge(s)       { return s.is_test          ? ' <span class="badge-test">test</span>'             : ''; }
  function uitgeslotenBadge(s){ return s.excluded_from_team ? ' <span class="badge-uitgesloten">uitgesloten</span>' : ''; }

  // Teams
  const teamKeys=Object.keys(teams).sort();
  document.getElementById('teams-lijst').innerHTML = teamKeys.length===0
    ? '<p class="leeg">Geen teams gevonden.</p>'
    : teamKeys.map(key => {
        const t   = teams[key];
        const url = `team.html?code=${encodeURIComponent(t.label)}&token=${encodeURIComponent(TOKEN)}`;

        // Statistieken per team
        const nMeetelt = t.leden.filter(l => !l.is_test && !l.excluded_from_team).length;
        const nTest    = t.leden.filter(l =>  l.is_test).length;
        const nUitgesl = t.leden.filter(l =>  l.excluded_from_team).length;

        // Statuslabel
        const stKlasse = nMeetelt >= 3 ? 'klaar' : nMeetelt === 2 ? 'bijna' : 'weinig';
        const stTekst  = nMeetelt >= 3 ? 'rapport klaar' : nMeetelt === 2 ? 'bijna genoeg' : 'te weinig data';
        const statusBadge = `<span class="badge-status ${stKlasse}">${stTekst}</span>`;

        // Stats-regel in body
        const statsDelen = [`${nMeetelt} meetelt`];
        if (nTest)    statsDelen.push(`${nTest} test`);
        if (nUitgesl) statsDelen.push(`${nUitgesl} uitgesloten`);
        const statsRegel = `<div class="team-stats">${statsDelen.join(' · ')}</div>`;

        // Rapportknop
        const rapportKnop = nMeetelt < 3
          ? `<a href="${url}" target="_blank" class="btn btn-team">Teamrapport openen (beperkt) →</a>
             <div class="team-footer-warn">Minimaal 3 meetellende respondenten aanbevolen.</div>`
          : `<a href="${url}" target="_blank" class="btn btn-team">Teamrapport openen →</a>`;

        const rijen = t.leden.map(l=>`
          <tr class="${l.excluded_from_team ? 'lid-uitgesloten' : l.is_test ? 'lid-test' : ''}">
            <td>${esc(l.naam)}${testBadge(l)}${uitgeslotenBadge(l)}</td>
            <td style="color:#888">${esc(l.rol||'–')}</td>
            <td style="color:#888">${fmt(l.created_at)}</td>
            <td style="text-align:right;white-space:nowrap">${acties(l)}</td>
          </tr>`).join('');

        return `
          <div class="team-blok" id="team-${key}">
            <div class="team-header" onclick="toggleTeam('${key}')">
              <span class="team-naam">${esc(t.label)}</span>
              <div class="team-header-rechts">
                <span class="team-count">${t.leden.length} ${t.leden.length===1?'lid':'leden'}</span>
                ${statusBadge}
                <span class="chevron">▼</span>
              </div>
            </div>
            <div class="team-body">
              ${statsRegel}
              <table class="leden-tabel">
                <thead><tr><th>Naam</th><th>Rol</th><th>Datum</th><th></th></tr></thead>
                <tbody>${rijen}</tbody>
              </table>
              <div class="team-footer">
                ${rapportKnop}
              </div>
            </div>
          </div>`;
      }).join('');

  // Individueel
  document.getElementById('ind-lijst').innerHTML = ind.length===0
    ? '<p class="leeg">Geen inzendingen zonder team.</p>'
    : ind.map(s=>`
        <div class="ind-rij${s.is_test ? ' is-test' : ''}">
          <div>
            <div class="ind-naam">${esc(s.naam)}${testBadge(s)}</div>
            <div class="ind-sub">${esc(s.email)} &nbsp;·&nbsp; ${fmt(s.created_at)}</div>
          </div>
          <div class="ind-rechts">${acties(s)}</div>
        </div>`).join('');

  // Verwijderd
  document.getElementById('del-lijst').innerHTML = deleted.length===0
    ? '<p class="leeg">Geen verwijderde inzendingen.</p>'
    : deleted.map(s=>`
        <div class="ind-rij">
          <div>
            <div class="ind-naam">${esc(s.naam)}${testBadge(s)}</div>
            <div class="ind-sub">${s.team_code?esc(s.team_code)+' &nbsp;·&nbsp; ':''}${fmt(s.deleted_at)} verwijderd</div>
          </div>
          <div class="ind-rechts">
            <button onclick="herstel('${s.id}')" class="btn btn-restore">Herstel</button>
          </div>
        </div>`).join('');
}

function toggleTeam(key) { document.getElementById('team-'+key).classList.toggle('open'); }
function toggleDel() {
  const el = document.getElementById('del-lijst');
  const open = el.style.display !== 'none';
  el.style.display = open ? 'none' : 'block';
  document.getElementById('del-chevron').textContent = open ? '▶' : '▼';
}

// ── Acties ────────────────────────────────────────────────────────────────────
async function verwijder(id, naam) {
  if (!confirm(`Weet je zeker dat je "${naam}" wilt verwijderen?\n\nDe inzending blijft herstelbaar.`)) return;
  const r = await fetch(`/api/admin/submissions/${id}`, { method:'DELETE', headers:{'X-Admin-Token':TOKEN} });
  if (!r.ok) { alert('Verwijderen mislukt.'); return; }
  laadData();
}

async function herstel(id) {
  const r = await fetch(`/api/admin/submissions/${id}/restore`, { method:'POST', headers:{'X-Admin-Token':TOKEN} });
  if (!r.ok) { alert('Herstellen mislukt.'); return; }
  laadData();
}

async function toggleUitsluiting(id) {
  const s = allSubs.find(x => x.id === id);
  if (!s) return;
  const r = await fetch(`/api/admin/submissions/${id}`, {
    method:  'PATCH',
    headers: { 'Content-Type':'application/json', 'X-Admin-Token': TOKEN },
    body:    JSON.stringify({
      naam:               s.naam,
      email:              s.email,
      team_code:          s.team_code || null,
      rol:                s.rol       || null,
      is_test:            s.is_test            ? 1 : 0,
      excluded_from_team: s.excluded_from_team ? 0 : 1,
    }),
  });
  if (!r.ok) { alert('Actie mislukt.'); return; }
  laadData();
}

async function toggleTest(id) {
  const s = allSubs.find(x => x.id === id);
  if (!s) return;
  const r = await fetch(`/api/admin/submissions/${id}`, {
    method:  'PATCH',
    headers: { 'Content-Type':'application/json', 'X-Admin-Token': TOKEN },
    body:    JSON.stringify({
      naam:               s.naam,
      email:              s.email,
      team_code:          s.team_code || null,
      rol:                s.rol       || null,
      is_test:            s.is_test            ? 0 : 1,
      excluded_from_team: s.excluded_from_team ? 1 : 0,
    }),
  });
  if (!r.ok) { alert('Actie mislukt.'); return; }
  laadData();
}

// ── Modal: bewerken ───────────────────────────────────────────────────────────
function openModal({ id, naam, email, team, rol, is_test }) {
  document.getElementById('modal-id').value       = id;
  document.getElementById('modal-naam').value     = naam;
  document.getElementById('modal-email').value    = email;
  document.getElementById('modal-team').value     = team;
  document.getElementById('modal-rol').value      = rol;
  document.getElementById('modal-istest').checked = !!is_test;
  document.getElementById('modal-fout').style.display = 'none';
  document.getElementById('modal-overlay').classList.add('actief');
  document.getElementById('modal-naam').focus();
}
function sluitModal() { document.getElementById('modal-overlay').classList.remove('actief'); }
document.getElementById('modal-overlay').addEventListener('click', e => { if (e.target.id==='modal-overlay') sluitModal(); });

async function slaOp() {
  const id    = document.getElementById('modal-id').value;
  const naam  = document.getElementById('modal-naam').value.trim();
  const email = document.getElementById('modal-email').value.trim();
  const team  = document.getElementById('modal-team').value.trim();
  const rol     = document.getElementById('modal-rol').value.trim();
  const is_test = document.getElementById('modal-istest').checked ? 1 : 0;
  const fout    = document.getElementById('modal-fout');
  fout.style.display = 'none';

  if (!naam)  { fout.textContent='Naam is verplicht.';   fout.style.display='block'; return; }
  if (!email) { fout.textContent='E-mail is verplicht.'; fout.style.display='block'; return; }

  const r = await fetch(`/api/admin/submissions/${id}`, {
    method:  'PATCH',
    headers: { 'Content-Type':'application/json', 'X-Admin-Token': TOKEN },
    body:    JSON.stringify({ naam, email, team_code: team||null, rol: rol||null, is_test }),
  });
  const d = await r.json();
  if (!r.ok) { fout.textContent = d.error || 'Opslaan mislukt.'; fout.style.display='block'; return; }
  sluitModal();
  laadData();
}
</script>
